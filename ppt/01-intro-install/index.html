<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 Python 科研环境搭建</title>
  <meta name="description" content="第一讲 Python 科研环境搭建上课用 HTML 课件。">
  <style>
    :root {
      --ink: #101820;
      --panel: rgba(255, 255, 255, 0.92);
      --line: rgba(16, 24, 32, 0.16);
      --accent: #d9a321;
      --blue: #1e5b8f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #101820;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .deck-shell {
      position: relative;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      padding: 52px 22px 70px;
      background:
        linear-gradient(135deg, rgba(30, 91, 143, 0.35), transparent 48%),
        radial-gradient(circle at 80% 18%, rgba(217, 163, 33, 0.22), transparent 26%),
        #101820;
    }

    .slide-frame {
      position: relative;
      width: min(100%, calc((100vh - 138px) * 16 / 9));
      max-width: 1480px;
      aspect-ratio: 16 / 9;
      background: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.36);
    }

    .slide-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .topbar,
    .controlbar {
      position: fixed;
      z-index: 5;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink);
    }

    .topbar {
      top: 14px;
    }

    .controlbar {
      bottom: 14px;
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(14px);
    }

    .deck-title {
      min-width: 0;
      max-width: min(62vw, 760px);
      padding: 9px 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
    }

    .toolbar-link,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 38px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }

    .toolbar-link:hover,
    .icon-button:hover {
      color: #fff;
      background: var(--blue);
      text-decoration: none;
    }

    .icon-button:disabled {
      color: rgba(16, 24, 32, 0.32);
      background: rgba(255, 255, 255, 0.52);
      cursor: not-allowed;
    }

    .counter {
      min-width: 80px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .progress {
      position: fixed;
      z-index: 6;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background: rgba(255, 255, 255, 0.22);
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.18s ease;
    }

    .thumbs {
      position: fixed;
      z-index: 7;
      inset: 64px 18px 80px;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      overflow: auto;
      padding: 16px;
      background: rgba(16, 24, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.42);
    }

    .thumbs.open {
      display: grid;
    }

    .thumb {
      padding: 0;
      overflow: hidden;
      color: #fff;
      background: #fff;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    .thumb.active {
      border-color: var(--accent);
    }

    .thumb img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .thumb span {
      display: block;
      padding: 6px 8px;
      color: var(--ink);
      background: #fff;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .deck-shell {
        padding: 58px 10px 82px;
      }

      .topbar,
      .controlbar {
        left: 8px;
        right: 8px;
        flex-wrap: wrap;
      }

      .deck-title {
        max-width: calc(100vw - 34px);
      }

      .toolbar-group {
        flex-wrap: wrap;
      }

      .toolbar-link,
      .icon-button {
        min-width: 38px;
        height: 36px;
        padding: 0 10px;
      }

      .thumbs {
        inset: 104px 8px 96px;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      }
    }

    @media print {
      html,
      body {
        height: auto;
        overflow: visible;
        background: #fff;
      }

      .topbar,
      .controlbar,
      .progress,
      .thumbs {
        display: none !important;
      }

      .deck-shell {
        display: block;
        height: auto;
        padding: 0;
        background: #fff;
      }

      .slide-frame {
        width: 100%;
        max-width: none;
        box-shadow: none;
        border: 0;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="课件导航">
    <div class="toolbar-group deck-title">01 Python 科研环境搭建 · 讲授版</div>
    <div class="toolbar-group">
      <a class="toolbar-link" href="../../chapters/01-intro-install.html">章节页</a>
      <a class="toolbar-link" href="../../index.html">课程首页</a>
      <a class="toolbar-link" href="01-Python科研环境搭建-heyl-v2.pdf">PDF</a>
    </div>
  </header>

  <main class="deck-shell" aria-live="polite">
    <figure class="slide-frame">
      <img id="slideImage" src="assets/slide-01.jpg" alt="第 1 页课件">
    </figure>
  </main>

  <nav class="controlbar" aria-label="课件控制">
    <div class="toolbar-group">
      <button class="icon-button" id="firstButton" type="button" aria-label="第一页">|&lt;</button>
      <button class="icon-button" id="prevButton" type="button" aria-label="上一页">&lt;</button>
      <span class="counter" id="counter">1 / 45</span>
      <button class="icon-button" id="nextButton" type="button" aria-label="下一页">&gt;</button>
      <button class="icon-button" id="lastButton" type="button" aria-label="最后一页">&gt;|</button>
    </div>
    <div class="toolbar-group">
      <button class="icon-button" id="thumbButton" type="button" aria-label="打开缩略图">缩略图</button>
      <button class="icon-button" id="fullscreenButton" type="button" aria-label="全屏">全屏</button>
    </div>
  </nav>

  <aside class="thumbs" id="thumbs" aria-label="课件缩略图"></aside>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

  <script>
    const totalSlides = 45;
    const slideImage = document.getElementById("slideImage");
    const counter = document.getElementById("counter");
    const progressBar = document.getElementById("progressBar");
    const firstButton = document.getElementById("firstButton");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const lastButton = document.getElementById("lastButton");
    const thumbButton = document.getElementById("thumbButton");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const thumbs = document.getElementById("thumbs");

    let currentSlide = 1;

    function slideSrc(index) {
      return `assets/slide-${String(index).padStart(2, "0")}.jpg`;
    }

    function setSlide(index) {
      currentSlide = Math.min(totalSlides, Math.max(1, index));
      slideImage.src = slideSrc(currentSlide);
      slideImage.alt = `第 ${currentSlide} 页课件`;
      counter.textContent = `${currentSlide} / ${totalSlides}`;
      progressBar.style.width = `${(currentSlide / totalSlides) * 100}%`;
      firstButton.disabled = currentSlide === 1;
      prevButton.disabled = currentSlide === 1;
      nextButton.disabled = currentSlide === totalSlides;
      lastButton.disabled = currentSlide === totalSlides;
      document.querySelectorAll(".thumb").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.slide) === currentSlide);
      });
    }

    function buildThumbs() {
      const fragment = document.createDocumentFragment();
      for (let index = 1; index <= totalSlides; index += 1) {
        const button = document.createElement("button");
        button.className = "thumb";
        button.type = "button";
        button.dataset.slide = index;
        button.innerHTML = `<img src="${slideSrc(index)}" alt=""><span>${index}</span>`;
        button.addEventListener("click", () => {
          setSlide(index);
          thumbs.classList.remove("open");
        });
        fragment.appendChild(button);
      }
      thumbs.appendChild(fragment);
    }

    firstButton.addEventListener("click", () => setSlide(1));
    prevButton.addEventListener("click", () => setSlide(currentSlide - 1));
    nextButton.addEventListener("click", () => setSlide(currentSlide + 1));
    lastButton.addEventListener("click", () => setSlide(totalSlides));
    thumbButton.addEventListener("click", () => thumbs.classList.toggle("open"));
    fullscreenButton.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
        event.preventDefault();
        setSlide(currentSlide + 1);
      }
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        event.preventDefault();
        setSlide(currentSlide - 1);
      }
      if (event.key === "Home") {
        setSlide(1);
      }
      if (event.key === "End") {
        setSlide(totalSlides);
      }
      if (event.key === "Escape") {
        thumbs.classList.remove("open");
      }
    });

    buildThumbs();
    setSlide(1);
  </script>
</body>
</html>
